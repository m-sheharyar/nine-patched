<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nine-patched — 9-patch image generator</title>
    <meta
      name="description"
      content="Generate 9-patch PNG images in the browser for Roku and Android: shapes, gradients, borders, stretch and content regions, a live stretched preview, shareable links."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved/system theme before paint to avoid a flash. Must match useTheme:
      // an explicit stored choice wins, anything else follows the system preference.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
